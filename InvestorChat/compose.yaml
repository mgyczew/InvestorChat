services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: investorchat
      POSTGRES_USER: ${POSTGRES_USER:-investorchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=investorchat;Username=${POSTGRES_USER:-investorchat};Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in .env (at least 32 bytes)}
      Jwt__Issuer: InvestorChat
      Jwt__Audience: InvestorChatUsers
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data:
